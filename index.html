<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simon Zhang 的个人主页。">
  <title>Simon Zhang</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { color-scheme: light; --accent: #0078d4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #222;
      background: #eef8ff;
    }
    .background {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(214,236,255,.8), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,201,138,.7), transparent 35%),
        radial-gradient(circle at 60% 80%, rgba(234,246,255,.7), transparent 45%),
        linear-gradient(180deg, #eef8ff, #fff4e6);
      background-size: 135% 135%;
      animation: drift 15s ease-in-out infinite alternate;
    }
    main {
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 64px 24px 14vh;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 8.5vw, 6rem);
      font-weight: 600; line-height: 1.18; letter-spacing: -.035em;
      word-spacing: .06em;
      text-align: center; color: #426c96;
    }
    h1 span {
      display: inline-block;
      filter: drop-shadow(0 2px 3px rgba(76, 112, 153, .10))
              drop-shadow(0 10px 16px rgba(76, 112, 153, .12));
    }
    @supports (background-clip: text) or (-webkit-background-clip: text) {
      h1 span {
        background: linear-gradient(90deg, #4b8dff, #e9a04d);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
    }
    .subtitle {
      margin: 16px 0 0;
      font-size: 1.05rem; line-height: 1.7;
      color: #555; text-align: center;
    }
    .subtitle b { font-weight: 600; }
    nav {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 18px;
      margin-top: 40px;
    }
    .nav-link {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 12px 22px; border-radius: 13px;
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.32); color: #426b8d; text-decoration: none;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      font-size: 1rem; font-weight: 500; white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 4px 16px rgba(91,119,144,.045);
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .nav-link:hover {
      background: rgba(255,255,255,.6); transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 8px 22px rgba(91,119,144,.09);
    }
    .contacts { display: flex; justify-content: center; gap: 24px; margin-top: 28px; }
    .contacts a {
      color: var(--accent); font-size: 24px; line-height: 1.5;
      transition: .2s; text-decoration: none;
    }
    .contacts a:hover { transform: scale(1.15); color: #0066b3; }
    a:focus-visible { outline: 3px solid #005a9f; outline-offset: 7px; border-radius: 8px; }
    @keyframes drift {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      main > h1,
      main > .subtitle,
      main > nav,
      main > .contacts {
        animation: appear .75s cubic-bezier(.22, 1, .36, 1) backwards;
      }
      main > h1 { animation-delay: .04s; }
      main > .subtitle { animation-delay: .16s; }
      main > nav { animation-delay: .28s; }
      main > .contacts { animation-delay: .4s; }
      main > :focus-within { animation: none; }
    }
    @media (max-width: 600px) {
      main { padding: 56px 24px 10svh; }
      h1 { font-size: clamp(2.5rem, 9vw, 3.5rem); }
      nav { flex-direction: column; width: min(100%, 280px); margin-top: 32px; gap: 14px; }
      .nav-link { width: 100%; min-height: 48px; }
      .contacts { margin-top: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .background { animation: none; }
      a { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <main>
    <h1><span>Simon Zhang</span></h1>
    <p class="subtitle">热爱语言、设计、数码与游戏的 <b>Conlanger</b></p>
    <nav aria-label="主要导航">
      <a class="nav-link" href="https://simonzhang.art/zeksa">仄克萨语学习</a>
      <a class="nav-link" href="https://simonzhang.art/dictionary">词典查询</a>
      <a class="nav-link" href="https://simonzhang.art/resources">资源下载</a>
    </nav>
    <div class="contacts" aria-label="联系方式">
      <a href="https://space.bilibili.com/543929703" target="_blank" rel="noopener noreferrer" title="B站" aria-label="B站（在新标签页打开）">
        <i class="fa-brands fa-bilibili" aria-hidden="true"></i>
      </a>
      <a href="mailto:simonzhang96@icloud.com" title="邮箱" aria-label="邮箱">
        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
      </a>
    </div>
  </main>
</body>
</html>
