<!DOCTYPE html>
<!-- 仄克萨语学习 · Created by Simon Zhang. All rights reserved. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仄克萨语学习</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    :root {
      --accent: #0078D4;
      --text-color: #222;
      --label-color: #555;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 904px;
      margin: auto;
      padding: 2em;
      background: transparent;
      color: var(--text-color);
      line-height: 1.8;
      overflow-wrap: anywhere;
      isolation: isolate;
    }
    #bg {
      position: fixed;
      inset: 0;
      height: 100dvh;
      width: 100%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(214,236,255,0.8), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,201,138,0.7), transparent 35%),
        radial-gradient(circle at 60% 80%, rgba(234,246,255,0.7), transparent 45%),
        linear-gradient(180deg, #eef8ff, #fff4e6);
      animation: drift 15s ease-in-out infinite alternate;
      background-size: 135% 135%;
    }
    @keyframes drift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .page-header { margin: 24px auto 28px; }
    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 2.5rem;
      line-height: 1.4;
      margin: 0 0 16px;
    }
    .intro { text-align: center; margin: 0; color: var(--label-color); }
    .entry {
      display: block;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px 24px;
      margin: 30px auto;
      max-width: 800px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 0 20px rgba(255,255,255,0.15);
    }
    a { color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .article-link {
      color: var(--text-color);
      text-decoration: none;
      transition: transform 0.15s ease-out, box-shadow 0.2s ease;
    }
    .article-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.13), 0 0 35px rgba(255,255,255,0.25);
    }
    .article-link h2, .introduction h2 { color: var(--accent); font-size: 1.3rem; margin: 0 0 8px; }
    .article-link p, .introduction p { color: var(--label-color); margin: 0; }
    .read-more { display: inline-block; color: var(--accent); margin-top: 12px; font-size: .95rem; }
    .home-back-btn { position: fixed; top: 24px; left: 24px; z-index: 10; }
    .home-back-btn a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      color: var(--accent);
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .home-back-btn a:hover { background: rgba(255,255,255,0.95); }
    .home-back-btn svg { width: 21px; height: 21px; }
    .article-body { padding: 28px 32px; }
    .article-body h2 { color: var(--accent); font-size: 1.4rem; margin: 1.5em 0 .6em; }
    .article-body h2:first-child { margin-top: 0; }
    .article-body h3 { font-size: 1.1rem; margin: 1.2em 0 .5em; }
    .article-body p { text-align: left; margin: .8em 0; }
    .article-body img { max-width: 100%; height: auto; }
    .example {
      background: #eaf2fb;
      margin-top: 0.8em;
      padding: 12px 16px;
      border-radius: 10px;
      color: #2c3e50;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .example p { margin: .3em 0; }
    .back-link { text-align: center; margin: 24px auto; }
    .back-link a { text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    .logo { width: 100%; max-width: 220px; height: auto; display: block; margin: 1.4rem auto; }
    .footer { text-align: center; color: #777; font-size: .9rem; margin-top: 32px; }
    @font-face {
      font-family: "ZeksaFont";
      src: url("/fonts/Zeksa Ajkrus.ttf") format("truetype");
      font-display: swap;
    }
    .zeksa { font-family: "ZeksaFont", sans-serif; }
    @media (max-width: 600px) {
      body { padding: 1em; }
      .page-header { margin-top: 64px; }
      h1 { font-size: 1.8rem; }
      .home-back-btn { top: 16px; left: 16px; }
      .home-back-btn a { width: 38px; height: 38px; }
      .entry { padding: 18px 20px; margin: 24px auto; }
      .article-body { padding: 22px 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #bg { animation: none; }
      .article-link { transition: none; }
      .article-link:hover { transform: none; }
    }
  </style>
</head>

  <div class="home-back-btn">
    <a href="/" title="返回主页" aria-label="返回主页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
    </a>
  </div>
  <main>
    <header class="page-header">
      <h1>仄克萨语学习</h1>
      <p class="intro">点击下方文章，进入学习。</p>
    </header>
    <section class="entry introduction" aria-labelledby="about-zeksa">
      <h2 id="about-zeksa">关于仄克萨语</h2>
      <p>仄克萨语有专用的字母，也可以用拉丁字母转写。配套词典支持两种字母的显示切换，并提供词义、词类、构词信息和例句，便于结合学习文章对照查阅。</p>
    </section>
    <section aria-label="学习文章">
      <!-- 此列表由 update_articles.py 从文章中生成，无需手动维护。 -->

      <p class="intro">暂无学习文章。</p>
      <!-- ARTICLES:END -->
    </section>
  </main>
  <footer>
    <img src="/ZeksaLogo.png" class="logo" alt="仄克萨标识">
    <p class="footer">© 2026 Simon Zhang · Drekomka</p>
  </footer>
</body>
</html>
